name: Build APK

on:
  push:
    branches: [ main, master ]
    # The Windows app has its own build (windows-build.yml).
    paths-ignore:
      - 'windows/**'
      - 'docs/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
    inputs:
      android5:
        description: 'Also build the special Android 5.0 APK'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub Ubuntu runner already contains the Android SDK (ANDROID_HOME).
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Put the signing key in place (from GitHub Secrets)
        env:
          NOVA_KEY_PASS: ${{ secrets.NOVA_KEY_PASS }}
        run: |
          mkdir -p keystore
          # Public copy: the key is stored encrypted; the one secret NOVA_KEY_PASS opens it.
          if [ ! -f keystore/nova-release.jks ] && [ -n "$NOVA_KEY_PASS" ]; then
            for f in nova-release.jks signing.properties; do
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "keystore-enc/$f.enc" -out "keystore/$f" -pass env:NOVA_KEY_PASS
            done
          fi
          if [ ! -f keystore/nova-release.jks ]; then
            echo "::error title=Signing key missing::The NOVA_KEY_PASS secret is $( [ -n "$NOVA_KEY_PASS" ] && echo "set (${#NOVA_KEY_PASS} characters) but did not open the key" || echo "NOT set in this repository")"
            exit 1
          fi
          echo "::notice title=Signing key::ready"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Version 4.0 DLNA: build numbers start again at 01 (GitHub's run number − 99), always 2 digits.
      - name: Build number
        run: echo "NOVA_BUILD=$(printf '%02d' $(( ${{ github.run_number }} - 99 )))" >> "$GITHUB_ENV"

      - name: Build the APK
        id: build
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          if [ -n "$TMDB_KEY" ]; then echo "::notice title=TMDB key::built in (${#TMDB_KEY} characters)"; else echo "::warning title=TMDB key::the TMDB_KEY secret is not set"; fi
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/NovaIPTV-4.0-DLNA-build-${NOVA_BUILD}.apk"

      # The special build for Android 5.0 and 6 (same app, lower minimum): ONLY when asked (manual run with android5 = true).
      # It never blocks the normal APK:
      # when it fails, its log goes to the ci-logs branch (logs/run-N-android5.txt).
      - name: Build the Android 5.0 APK
        id: legacy
        if: github.event_name == 'workflow_dispatch' && inputs.android5
        continue-on-error: true
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          set -o pipefail
          rm -rf app/build/outputs/apk/release
          ./gradlew lintRelease assembleRelease -Plegacy=true --no-daemon 2>&1 | tee legacy.log
          cp app/build/outputs/apk/release/*.apk "out/NovaIPTV-4.0-DLNA-Android5.0-build-${NOVA_BUILD}.apk"

      - name: Keep the Android 5.0 build log
        if: steps.legacy.outcome == 'failure'
        continue-on-error: true
        run: |
          { grep -nE "^e: |error:|Error:|What went wrong|FAILURE|Unresolved|NewApi|requires API|minSdk" legacy.log | head -120; echo ----; cat app/lint-newapi.txt 2>/dev/null | head -300; } > legacy-errors.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs origin/ci-logs 2>/dev/null || { git checkout --orphan ci-logs; git rm -rf --cached . > /dev/null; }
          mkdir -p logs
          cp legacy-errors.txt "logs/run-${{ github.run_number }}-android5.txt"
          git add logs/run-${{ github.run_number }}-android5.txt
          git commit -m "Android 5 build log for run ${{ github.run_number }}"
          git push -f origin ci-logs

      # When the build fails, report the important lines as annotations and keep the full
      # log on a "ci-logs" branch, so the errors can be read without the Actions log viewer.
      - name: Report build errors
        if: failure()
        run: |
          touch build.log
          grep -nE "^e: |error:|What went wrong|Could not|FAILURE|Unresolved|Exception" build.log | head -60 > errors.txt || true
          if [ ! -s errors.txt ]; then tail -60 build.log > errors.txt; fi
          msg=$(sed -e 's/%/%25/g' errors.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Build failed::${msg}"
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          mkdir -p logs
          cp build.log "logs/run-${{ github.run_number }}.log"
          cp errors.txt "logs/run-${{ github.run_number }}-errors.txt"
          git add logs
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin ci-logs

      - name: Check the filter-list addresses (information only)
        continue-on-error: true
        run: |
          grep -o 'https://[^"]*' app/src/main/java/com/nova/iptv/data/FilterLists.kt | while read u; do
            echo "FILTERURL $(curl -sL -o /tmp/f.txt -w '%{http_code}' -m 30 -A 'Mozilla/5.0 NovaIPTV' "$u") $(wc -c </tmp/f.txt) $u"
          done

      - name: Keep the APK as a download (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: NovaIPTV-apk
          path: out/NovaIPTV-*.apk

      - name: Publish the APK on the Releases page (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4-build-${{ env.NOVA_BUILD }}
          name: Nova IPTV 4.0 DLNA build ${{ env.NOVA_BUILD }}
          body: Install NovaIPTV-4.0-DLNA-build-${{ env.NOVA_BUILD }}.apk on your phone or Android TV (Android 7.0 and newer).${{ steps.legacy.outcome == 'success' && format(' For Android 5.0 / 6 (older tablets) use NovaIPTV-4.0-DLNA-Android5.0-build-{0}.apk.', env.NOVA_BUILD) || '' }}
          files: out/NovaIPTV-*.apk
          make_latest: true
